
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #FFC0CB;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .table th {
            background-color: #f2f2f2;
        }
        .cell-content {
            background-color: #0073ff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .cell-content2 {
            background-color: #aa00f8;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        @media (max-width: 768px) {
            .table, .table tbody, .table tr, .table td {
                display: block;
                width: 100%;
            }
            .table tr {
                margin-bottom: 15px;
            }
            .table td {
                text-align: right;
                padding-left: 50%;
                position: relative;
            }
            .table td::before {
                content: attr(data-label);
                position: absolute;
                left: 0;
                width: 50%;
                padding-left: 15px;
                font-weight: bold;
                text-align: left;
            }
        }   
    </style>
</head>
<body>
    <main class="container">
        <table class="table">
            <tbody>
                <tr>
                    <td>
                        <div class="cell-content">
                            <h1 style="color: white;">First Cell</h1>
                            <p style="color: white; text-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">This is the content of the first cell.</p>
                        </div>
                    </td>

                    <td>
                        <div class="cell-content2">
                            <h1 style="color: white;">Second Cell</h1>
                            <p style="color: white; text-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">This is the content of the second cell.</p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
