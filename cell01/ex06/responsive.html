<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>

    <style>
        /* 1. Force html and body to take up 100% of the screen */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents unwanted scrollbars */
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #FFC0CB;  
        }

        /* 2. Make the table span the entire viewport */
        .responsive-table {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Ensures equal splitting */
        }

        /* 3. Make each cell fill 50% width and 100% height */
        .responsive-table td {
            width: 50%;
            height: 100%;
            border: 1px solid #ddd;
            padding: 0;
        }

        .responsive-cell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .content1 {
            background-color: #0073ff;
        }

        .content2 {
            background-color: #aa00f8;
        }

        /* Responsive behavior for smaller screens */
        @media (max-width: 768px) {
            html, body {
                overflow: auto; /* Allow scrolling on mobile if content overflows */
            }
            .responsive-table, .responsive-table tbody, .responsive-table tr, .responsive-table td {
                display: block;
                width: 100%;
                height: auto;
            }
            .responsive-table td {
                min-height: 50vh; /* Each box takes at least half the mobile screen height */
            }
        }
    </style>
</head>
<body>
    <table class="responsive-table">
        <tr>
            <td>
                <div class="responsive-cell content1">
                    <h1 style="color: white;">First Cell</h1>
                    <p style="color: white;">This is the content of the first cell.</p>
                </div>
            </td>
            <td>
                <div class="responsive-cell content2">
                    <h1 style="color: white;">Second Cell</h1>
                    <p style="color: white;">This is the content of the second cell.</p>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
