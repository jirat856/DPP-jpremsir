<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card - Exercise 03</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card-container">
        <div class="card-header">
            <h2>Developer Profile</h2>
        </div>
    

        <table class="profile-table">
            <tr>
                <td align="center">
                    <!-- Profile Picture -->
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPrgUFom5eCojS3hcr4nBh3SEIvb2frZBr7D57ACjfIQ&s=10" alt="Profile Picture" class="profile-pic">
                        
                    <!-- Login located under the picture -->
                    <div class="profile-login">Jpremsir</div>
                        
                    <!-- 2-3 words description under the login -->
                    <div class="profile-description">Unpassionate Burnout Person</div>
                        
                    <!-- Small images lined up for social networks -->
                    <div class="social-icons">
                        <a href="https://github.com/jirat856/DPP-jpremsir" target="_blank"><img src="https://img.icons8.com/ios-filled/50/github.png" alt="GitHub"></a>
                        <a href="#" target="_blank"><img src="https://img.icons8.com/?size=100&id=32309&format=png&color=000000" alt="Instagram"></a>
                        <a href="#" target="_blank"><img src="https://img.icons8.com/?size=100&id=36172&format=png&color=000000" alt="Trust me"></a>
                    </div>
                </td>
            </tr>
        </table>

        <div class="card-footer">
            <button class="contact-btn" onclick="alert('Contact button clicked!')">Contact</button>
        </div>
    </div>
</body>
</html>
