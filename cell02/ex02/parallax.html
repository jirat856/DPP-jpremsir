<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax - Exercise 02</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <!-- Section 1: First Image with Centered Message -->
    <div class="parallax-section image-one">
        <div class="content-box">
            <h1>Welcome to the Journey</h1>
            <p>Enjoy the view from the top.</p>
        </div>
    </div>

    <!-- Section 2: Black Block with a Message -->
    <div class="solid-section black-block">
        <div class="content-box">
            <h2>The Darkness of Space / Midpoint</h2>
            <p>Through the shadows, we keep moving forward.</p>
        </div>
    </div>

    <!-- Section 3: Second Image with Centered Message -->
    <div class="parallax-section image-two">
        <div class="content-box">
            <h1>The Final Destination</h1>
            <p>You have reached the end of the page.</p>
        </div>
    </div>

</body>
</html>
