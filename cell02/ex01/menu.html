<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNCF Sandwich - Drop-down Menu</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <header>
        <h1>SNCF Bistro</h1>
        <p>Freshly prepared "Drop-down" Ham & Cheese Sandwiches</p>
    </header>

    <nav class="sandwich-menu">
        <!-- เมนูหลัก (ขนมปังชั้นบน / ส่วนหัวแซนด์วิช) -->
        <div class="menu-item">
            <a href="#" class="sandwich-layer bread-top">🥖 Choose Your Sandwich 🥪</a>
            
            <!-- ไส้แซนด์วิชที่ซ่อนอยู่ (Drop-down) -->
            <div class="sandwich-filling">
                <a href="#" class="ingredient butter">🧈 Extra French Butter</a>
                <a href="#" class="ingredient ham">🍖 Jambon Blanc (Ham)</a>
                <a href="#" class="ingredient cheese">🧀 Comté Cheese</a>
                <a href="#" class="ingredient salad">🥬 Fresh Salad & Tomato</a>
            </div>
        </div>
    </nav>

</body>
</html>
